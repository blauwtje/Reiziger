<!DOCTYPE html><html><head><meta charset="utf-8"><title>Inputs</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">inputs · search · time picker</div>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:10px">
    <span style="color:var(--fg-mute);font-size:13px;width:40px">Van</span>
    <span style="color:var(--fg);font-size:15px">Den Haag Centraal</span>
  </div>
  <div style="background:var(--ink-800);border:1px solid var(--signal);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 1px rgba(255,201,23,0.35),0 0 24px rgba(255,201,23,0.18)">
    <span style="color:var(--fg-mute);font-size:13px;width:40px">Naar</span>
    <span style="color:var(--fg);font-size:15px">Utrecht|</span>
  </div>
  <div style="display:flex;gap:10px">
    <div style="flex:1;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:10px">
      <span style="color:var(--fg-mute);font-size:11px;text-transform:uppercase;letter-spacing:0.08em">aankomst</span>
      <span class="mono" style="color:var(--fg);font-size:15px;margin-left:auto">vr 14 mei · 18:00</span>
    </div>
    <div style="background:var(--ink-700);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:8px">
      <span style="color:var(--fg-dim);font-size:13px">Min. overstap</span>
      <span class="mono" style="color:var(--fg);font-size:14px">6 min</span>
    </div>
  </div>
</div>
</body></html>
