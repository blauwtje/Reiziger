<!DOCTYPE html><html><head><meta charset="utf-8"><title>Status & delay chips</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">status chips · delay chips · modality badges</div>
<div style="display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:999px;font-size:12px;color:#16c79a">
      <span style="width:6px;height:6px;border-radius:50%;background:#16c79a"></span>Op tijd
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:999px;font-size:12px;color:#ffb020">
      <span style="width:6px;height:6px;border-radius:50%;background:#ffb020"></span>Vertraging
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:999px;font-size:12px;color:#ff5b52">
      <span style="width:6px;height:6px;border-radius:50%;background:#ff5b52"></span>Sterk vertraagd
    </span>
    <span class="mono" style="padding:4px 8px;border-radius:var(--r-sm);background:rgba(255,176,32,0.12);color:var(--warn);font-size:12px">+4</span>
    <span class="mono" style="padding:4px 8px;border-radius:var(--r-sm);background:rgba(255,91,82,0.14);color:var(--late);font-size:12px">+12</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-sm);font-size:12px;color:#ffc917;font-family:var(--font-mono)">
      <span style="width:8px;height:8px;border-radius:2px;background:#ffc917"></span>IC
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-sm);font-size:12px;color:#3f9bff;font-family:var(--font-mono)">
      <span style="width:8px;height:8px;border-radius:2px;background:#3f9bff"></span>Bus 41
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-sm);font-size:12px;color:#16c79a;font-family:var(--font-mono)">
      <span style="width:8px;height:8px;border-radius:2px;background:#16c79a"></span>Tram 17
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-sm);font-size:12px;color:#ff6a3d;font-family:var(--font-mono)">
      <span style="width:8px;height:8px;border-radius:2px;background:#ff6a3d"></span>Metro 53
    </span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-sm);font-size:12px;color:#8b9bff;font-family:var(--font-mono)">
      <span style="width:8px;height:8px;border-radius:2px;background:#8b9bff"></span>Pont
    </span>
  </div>
</div>
</body></html>
