<!DOCTYPE html><html><head><meta charset="utf-8"><title>Split-flap cell</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">split-flap time cell — signature element</div>
<div style="display:flex;gap:14px;align-items:center;padding:10px 0">
  <div style="position:relative;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:18px 22px;box-shadow:0 1px 0 rgba(255,255,255,0.04) inset,0 -1px 0 rgba(0,0,0,0.6) inset,0 2px 6px rgba(0,0,0,0.5)">
    <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink-900)"></div>
    <span class="mono" style="font-size:36px;color:var(--signal);font-weight:500;letter-spacing:-0.02em">08:42</span>
  </div>
  <span class="mono" style="color:var(--fg-dim);font-size:22px">→</span>
  <div style="position:relative;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:18px 22px;box-shadow:0 1px 0 rgba(255,255,255,0.04) inset,0 -1px 0 rgba(0,0,0,0.6) inset,0 2px 6px rgba(0,0,0,0.5)">
    <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink-900)"></div>
    <span class="mono" style="font-size:36px;color:var(--signal);font-weight:500;letter-spacing:-0.02em">10:06</span>
  </div>
  <div style="margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
    <span class="mono" style="font-size:13px;color:var(--fg-dim)">Spoor <span style="color:var(--signal)">7a</span></span>
    <span class="mono" style="font-size:13px;color:var(--warn)">+4 min</span>
  </div>
</div>
<div class="mono" style="font-size:11px;color:var(--fg-mute);margin-top:8px">center seam · inset highlight/shade · amber digits · DM Mono</div>
</body></html>
