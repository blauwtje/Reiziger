<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mono — schedule data</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">dm mono — times, durations, platforms, delays</div>
<div style="background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:18px 22px;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:baseline;gap:18px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em">
    <span style="font-size:34px;font-weight:500;color:var(--fg)">08:42</span>
    <span style="font-size:18px;color:var(--fg-dim)">→</span>
    <span style="font-size:34px;font-weight:500;color:var(--fg)">10:06</span>
    <span style="font-size:18px;color:var(--fg-dim)">·  1u 24m</span>
  </div>
  <div class="mono" style="font-size:11px;color:var(--fg-mute)">mono-xl · 28/30 · used for big times on board</div>
  <div style="height:1px;background:var(--ink-line)"></div>
  <div style="display:flex;gap:18px;align-items:baseline;font-family:var(--font-mono);font-variant-numeric:tabular-nums">
    <span style="font-size:15px;color:var(--fg)">Spoor <span style="color:var(--signal);font-weight:500">7a</span></span>
    <span style="font-size:15px;color:var(--fg)">IC <span style="color:var(--fg-dim)">3041</span></span>
    <span style="font-size:15px;color:var(--warn)">+4</span>
    <span style="font-size:15px;color:var(--late)">+12</span>
  </div>
  <div class="mono" style="font-size:11px;color:var(--fg-mute)">mono · 15 · platform / train no / delay</div>
</div>
</body></html>
