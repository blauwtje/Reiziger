<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">buttons</div>
<div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
  <button style="background:var(--signal);color:var(--ink-900);font-family:var(--font-sans);font-size:14px;font-weight:600;border:0;padding:10px 16px;border-radius:var(--r-md);cursor:pointer;letter-spacing:-0.01em">Plan reis</button>
  <button style="background:var(--signal-soft);color:var(--ink-900);font-family:var(--font-sans);font-size:14px;font-weight:600;border:0;padding:10px 16px;border-radius:var(--r-md)">Plan reis (hover)</button>
  <button style="background:var(--ink-700);color:var(--fg);font-family:var(--font-sans);font-size:14px;font-weight:500;border:1px solid var(--ink-line);padding:10px 14px;border-radius:var(--r-md)">Bewaar reis</button>
  <button style="background:transparent;color:var(--fg-dim);font-family:var(--font-sans);font-size:14px;font-weight:500;border:0;padding:10px 12px;border-radius:var(--r-md)">Annuleer</button>
  <button style="background:var(--ink-800);color:var(--fg-mute);font-family:var(--font-sans);font-size:14px;font-weight:500;border:1px solid var(--ink-line);padding:10px 14px;border-radius:var(--r-md);cursor:not-allowed">Disabled</button>
</div>
<div class="mono" style="font-size:11px;color:var(--fg-mute);margin-top:14px">primary · primary hover · secondary · ghost · disabled</div>
</body></html>
