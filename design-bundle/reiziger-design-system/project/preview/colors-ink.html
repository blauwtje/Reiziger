<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ink</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">ink — layered near-black surfaces</div>
<div class="row" style="gap:0;border:1px solid var(--ink-line);border-radius:var(--r-md);overflow:hidden">
  
  <div style="flex:1;background:#0a0d12;padding:14px 12px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink-line)">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#0a0d12</div>
    <div>
      <div style="font-size:13px;font-weight:600">ink-900</div>
      <div class="label" style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:0.08em">page</div>
    </div>
  </div>
  <div style="flex:1;background:#11151c;padding:14px 12px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink-line)">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#11151c</div>
    <div>
      <div style="font-size:13px;font-weight:600">ink-800</div>
      <div class="label" style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:0.08em">panel</div>
    </div>
  </div>
  <div style="flex:1;background:#171c26;padding:14px 12px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink-line)">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#171c26</div>
    <div>
      <div style="font-size:13px;font-weight:600">ink-700</div>
      <div class="label" style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:0.08em">raised</div>
    </div>
  </div>
  <div style="flex:1;background:#1e2530;padding:14px 12px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink-line)">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#1e2530</div>
    <div>
      <div style="font-size:13px;font-weight:600">ink-600</div>
      <div class="label" style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:0.08em">hover</div>
    </div>
  </div>
  <div style="flex:1;background:#262e3c;padding:14px 12px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink-line)">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#262e3c</div>
    <div>
      <div style="font-size:13px;font-weight:600">ink-500</div>
      <div class="label" style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:0.08em">selected</div>
    </div>
  </div>
  <div style="flex:1;background:#313c4c;padding:14px 12px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--ink-line)">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#313c4c</div>
    <div>
      <div style="font-size:13px;font-weight:600">ink-400</div>
      <div class="label" style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:0.08em">chip</div>
    </div>
  </div>
</div>
<div style="margin-top:10px;display:flex;align-items:center;gap:10px">
  <div style="height:1px;flex:1;background:var(--ink-line)"></div>
  <span class="mono" style="font-size:11px;color:var(--fg-mute)">--ink-line · #28303d · 1px hairline</span>
  <div style="height:1px;flex:1;background:var(--ink-line)"></div>
</div>
</body></html>
