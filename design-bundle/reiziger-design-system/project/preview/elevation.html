<!DOCTYPE html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">shadow / glow tokens</div>
<div class="row" style="gap:14px">
  <div style="flex:1;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-lg);padding:18px;box-shadow:0 1px 0 rgba(255,255,255,0.02) inset,0 8px 24px rgba(0,0,0,0.45);min-height:130px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-size:13px;color:var(--fg-dim)">--shadow-panel</div>
    <div style="font-size:11px;color:var(--fg-mute)">board container, modals</div>
  </div>
  <div style="flex:1;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:18px;box-shadow:0 1px 0 rgba(255,255,255,0.04) inset,0 -1px 0 rgba(0,0,0,0.6) inset,0 2px 6px rgba(0,0,0,0.5);display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-size:13px;color:var(--fg-dim)">--shadow-flap</div>
    <div style="font-size:11px;color:var(--fg-mute)">split-flap cells (seam)</div>
  </div>
  <div style="flex:1;background:var(--ink-800);border:1px solid var(--signal);border-radius:var(--r-md);padding:18px;box-shadow:0 0 0 1px rgba(255,201,23,0.35),0 0 24px rgba(255,201,23,0.18);display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-size:13px;color:var(--signal)">--glow-signal</div>
    <div style="font-size:11px;color:var(--fg-mute)">focus, active row</div>
  </div>
</div>
</body></html>
