<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">spacing scale · row density</div>
<div class="row" style="gap:14px;align-items:flex-start">
  <div style="flex:1;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:14px">
    <div class="mono" style="font-size:11px;color:var(--fg-mute);margin-bottom:6px">scale (px)</div>
    
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:8px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">4</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:12px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">6</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:16px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">8</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:24px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">12</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:32px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">16</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:40px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">20</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
      <div style="height:8px;background:var(--signal);width:48px"></div>
      <span class="mono" style="font-size:11px;color:var(--fg-dim);width:24px">24</span>
    </div>
  </div>
  <div style="flex:1.2;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:0;overflow:hidden">
    <div class="mono" style="font-size:11px;color:var(--fg-mute);padding:10px 14px 6px">row · 56px</div>
    
    <div style="display:flex;align-items:center;height:56px;padding:0 14px;border-top:1px solid var(--ink-line);gap:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px">
      <span style="color:var(--fg);min-width:48px">08:42</span>
      <span style="color:var(--fg-dim)">→</span>
      <span style="color:var(--fg);min-width:48px">10:06</span>
      <span style="color:var(--fg-mute);margin-left:auto">1u 24m</span>
    </div>
    <div style="display:flex;align-items:center;height:56px;padding:0 14px;border-top:1px solid var(--ink-line);gap:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px">
      <span style="color:var(--fg);min-width:48px">09:14</span>
      <span style="color:var(--fg-dim)">→</span>
      <span style="color:var(--fg);min-width:48px">10:38</span>
      <span style="color:var(--fg-mute);margin-left:auto">1u 24m</span>
    </div>
    <div style="display:flex;align-items:center;height:56px;padding:0 14px;border-top:1px solid var(--ink-line);gap:12px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px">
      <span style="color:var(--fg);min-width:48px">09:48</span>
      <span style="color:var(--fg-dim)">→</span>
      <span style="color:var(--fg);min-width:48px">11:12</span>
      <span style="color:var(--fg-mute);margin-left:auto">1u 24m</span>
    </div>
  </div>
</div>
</body></html>
