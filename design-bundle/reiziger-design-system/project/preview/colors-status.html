<!DOCTYPE html><html><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">status — schedule health</div>
<div class="row" style="gap:8px">

  <div style="flex:1;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:130px;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:8px;height:8px;border-radius:50%;background:#16c79a"></span>
      <span class="mono" style="color:#16c79a;font-size:15px;font-weight:500">+0</span>
      <span style="font-size:12px;color:var(--fg-dim)">op tijd</span>
    </div>
    <div>
      <div style="font-size:13px;font-weight:600;color:#16c79a">--ok</div>
      <div class="mono" style="font-size:11px;color:var(--fg-mute)">#16c79a</div>
    </div>
  </div>
  <div style="flex:1;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:130px;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:8px;height:8px;border-radius:50%;background:#ffb020"></span>
      <span class="mono" style="color:#ffb020;font-size:15px;font-weight:500">+4</span>
      <span style="font-size:12px;color:var(--fg-dim)">vertraging</span>
    </div>
    <div>
      <div style="font-size:13px;font-weight:600;color:#ffb020">--warn</div>
      <div class="mono" style="font-size:11px;color:var(--fg-mute)">#ffb020</div>
    </div>
  </div>
  <div style="flex:1;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:130px;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:8px;height:8px;border-radius:50%;background:#ff5b52"></span>
      <span class="mono" style="color:#ff5b52;font-size:15px;font-weight:500">+12</span>
      <span style="font-size:12px;color:var(--fg-dim)">ernstig laat</span>
    </div>
    <div>
      <div style="font-size:13px;font-weight:600;color:#ff5b52">--late</div>
      <div class="mono" style="font-size:11px;color:var(--fg-mute)">#ff5b52</div>
    </div>
  </div>
</div>
</body></html>
