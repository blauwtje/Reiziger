<!DOCTYPE html><html><head><meta charset="utf-8"><title>Result row</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">journey result row · split-flap reveal</div>
<div style="background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);overflow:hidden">
  <div style="display:grid;grid-template-columns:90px 90px 90px 1fr 60px 30px;gap:14px;padding:8px 16px;background:var(--ink-900);border-bottom:1px solid var(--ink-line)" class="label">
    <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-mute)">Vertrek</span>
    <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-mute)">Aank</span>
    <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-mute)">Duur</span>
    <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-mute)">Overstap</span>
    <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-mute)">Spoor</span>
    <span></span>
  </div>
  
  <div style="display:grid;grid-template-columns:90px 90px 90px 1fr 60px 30px;gap:14px;padding:14px 16px;border-bottom:1px solid var(--ink-line);align-items:center;background:var(--ink-700);box-shadow:inset 2px 0 0 var(--signal)">
    <span class="mono" style="font-size:18px;color:var(--fg)">08:42</span>
    <span class="mono" style="font-size:18px;color:var(--fg)">10:06</span>
    <span class="mono" style="font-size:14px;color:var(--fg-dim)">1u 24m</span>
    <span style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:var(--rail)"></span><span style="font-size:13px;color:var(--fg-dim)">1× Utrecht C.</span></span>
    <span class="mono" style="font-size:14px;color:var(--signal);font-weight:500">7a</span>
    <span style="color:var(--fg-mute)">›</span>
  </div>
  <div style="display:grid;grid-template-columns:90px 90px 90px 1fr 60px 30px;gap:14px;padding:14px 16px;border-bottom:1px solid var(--ink-line);align-items:center;">
    <span class="mono" style="font-size:18px;color:var(--fg)">09:14</span>
    <span class="mono" style="font-size:18px;color:var(--fg)">10:38</span>
    <span class="mono" style="font-size:14px;color:var(--fg-dim)">1u 24m</span>
    <span style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:var(--rail)"></span><span style="font-size:13px;color:var(--fg-dim)">direct</span></span>
    <span class="mono" style="font-size:14px;color:var(--signal);font-weight:500">5</span>
    <span style="color:var(--fg-mute)">›</span>
  </div>
  <div style="display:grid;grid-template-columns:90px 90px 90px 1fr 60px 30px;gap:14px;padding:14px 16px;border-bottom:1px solid var(--ink-line);align-items:center;">
    <span class="mono" style="font-size:18px;color:var(--fg)">09:48</span>
    <span class="mono" style="font-size:18px;color:var(--fg)">11:12</span>
    <span class="mono" style="font-size:14px;color:var(--fg-dim)">1u 24m</span>
    <span style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:var(--rail)"></span><span style="font-size:13px;color:var(--fg-dim)">1× Gouda</span></span>
    <span class="mono" style="font-size:14px;color:var(--signal);font-weight:500">12</span>
    <span style="color:var(--fg-mute)">›</span>
  </div>
</div>
</body></html>
