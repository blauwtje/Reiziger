<!DOCTYPE html><html><head><meta charset="utf-8"><title>Signal</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">signal — one warm amber accent</div>
<div class="row" style="gap:10px;align-items:stretch">
  <div style="flex:2;background:var(--signal);color:var(--ink-900);padding:18px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:space-between;min-height:160px">
    <div class="mono" style="font-size:12px">#ffc917</div>
    <div>
      <div style="font-size:18px;font-weight:700">--signal</div>
      <div style="font-size:12px;opacity:0.75">focus · now · primary CTA</div>
    </div>
  </div>
  <div style="flex:1;background:var(--signal-soft);color:var(--ink-900);padding:18px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:space-between">
    <div class="mono" style="font-size:11px">#ffd750</div>
    <div>
      <div style="font-size:14px;font-weight:600">--signal-soft</div>
      <div style="font-size:11px;opacity:0.75">hover</div>
    </div>
  </div>
  <div style="flex:1;background:var(--signal-dim);color:var(--fg);padding:18px;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:space-between">
    <div class="mono" style="font-size:11px;color:var(--fg-dim)">#7a5f0a</div>
    <div>
      <div style="font-size:14px;font-weight:600">--signal-dim</div>
      <div style="font-size:11px;color:var(--fg-dim)">inactive marks</div>
    </div>
  </div>
</div>
<div style="margin-top:10px;font-size:11px;color:var(--fg-mute)">If two amber things appear in one viewport, one is wrong.</div>
</body></html>
