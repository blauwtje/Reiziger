<!DOCTYPE html><html><head><meta charset="utf-8"><title>Departure board</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">stationsbord — mini departure board</div>
<div style="background:var(--ink-900);border:1px solid var(--ink-line);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.45)">
  <div style="background:var(--ink-800);padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink-line)">
    <span style="width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal)"></span>
    <span style="font-size:13px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:600">Vertrek · Den Haag Centraal</span>
    <span class="mono" style="margin-left:auto;font-size:13px;color:var(--signal)">14:23</span>
  </div>
  
  <div style="display:grid;grid-template-columns:80px 30px 60px 1fr 14px 40px;gap:14px;padding:11px 16px;border-bottom:1px solid var(--ink-line);align-items:center">
    <span class="mono" style="font-size:18px;color:var(--signal);font-weight:500">08:42</span>
    <span class="mono" style="font-size:14px;color:var(--fg);font-weight:500">7a</span>
    <span class="mono" style="font-size:12px;color:#ffc917;padding:2px 6px;background:rgba(255,255,255,0.03);border-radius:var(--r-sm);text-align:center">IC</span>
    <span style="font-size:14px;color:var(--fg)">Utrecht Centraal</span>
    <span style="width:10px;height:10px;border-radius:50%;background:#16c79a"></span>
    <span class="mono" style="font-size:13px;color:var(--fg-dim);text-align:right">+0</span>
  </div>
  <div style="display:grid;grid-template-columns:80px 30px 60px 1fr 14px 40px;gap:14px;padding:11px 16px;border-bottom:1px solid var(--ink-line);align-items:center">
    <span class="mono" style="font-size:18px;color:var(--signal);font-weight:500">08:45</span>
    <span class="mono" style="font-size:14px;color:var(--fg);font-weight:500">12</span>
    <span class="mono" style="font-size:12px;color:#ffc917;padding:2px 6px;background:rgba(255,255,255,0.03);border-radius:var(--r-sm);text-align:center">Spr</span>
    <span style="font-size:14px;color:var(--fg)">Gouda</span>
    <span style="width:10px;height:10px;border-radius:50%;background:#ffb020"></span>
    <span class="mono" style="font-size:13px;color:#ffb020;text-align:right">+4</span>
  </div>
  <div style="display:grid;grid-template-columns:80px 30px 60px 1fr 14px 40px;gap:14px;padding:11px 16px;border-bottom:1px solid var(--ink-line);align-items:center">
    <span class="mono" style="font-size:18px;color:var(--signal);font-weight:500">08:51</span>
    <span class="mono" style="font-size:14px;color:var(--fg);font-weight:500">3</span>
    <span class="mono" style="font-size:12px;color:#3f9bff;padding:2px 6px;background:rgba(255,255,255,0.03);border-radius:var(--r-sm);text-align:center">Bus 41</span>
    <span style="font-size:14px;color:var(--fg)">Scheveningen</span>
    <span style="width:10px;height:10px;border-radius:50%;background:#16c79a"></span>
    <span class="mono" style="font-size:13px;color:var(--fg-dim);text-align:right">+0</span>
  </div>
</div>
</body></html>
