<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">corner radii</div>
<div class="row" style="gap:14px;align-items:flex-end">

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:80px;height:60px;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:2px"></div>
    <div class="mono" style="font-size:11px;color:var(--fg)">--r-xs</div>
    <div class="mono" style="font-size:11px;color:var(--fg-mute)">2px</div>
    <div style="font-size:11px;color:var(--fg-mute)">chip dot</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:80px;height:60px;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:4px"></div>
    <div class="mono" style="font-size:11px;color:var(--fg)">--r-sm</div>
    <div class="mono" style="font-size:11px;color:var(--fg-mute)">4px</div>
    <div style="font-size:11px;color:var(--fg-mute)">chips</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:80px;height:60px;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:6px"></div>
    <div class="mono" style="font-size:11px;color:var(--fg)">--r-md</div>
    <div class="mono" style="font-size:11px;color:var(--fg-mute)">6px</div>
    <div style="font-size:11px;color:var(--fg-mute)">panels</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:80px;height:60px;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:10px"></div>
    <div class="mono" style="font-size:11px;color:var(--fg)">--r-lg</div>
    <div class="mono" style="font-size:11px;color:var(--fg-mute)">10px</div>
    <div style="font-size:11px;color:var(--fg-mute)">board</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:80px;height:60px;background:var(--ink-700);border:1px solid var(--ink-line);border-radius:14px"></div>
    <div class="mono" style="font-size:11px;color:var(--fg)">--r-xl</div>
    <div class="mono" style="font-size:11px;color:var(--fg-mute)">14px</div>
    <div style="font-size:11px;color:var(--fg-mute)">modal</div>
  </div>
</div>
</body></html>
