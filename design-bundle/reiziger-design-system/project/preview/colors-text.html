<!DOCTYPE html><html><head><meta charset="utf-8"><title>Text colors</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="eyebrow">text on ink</div>
<div style="background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:18px 20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-around">
  <div style="display:flex;align-items:baseline;gap:14px">
    <span style="color:var(--fg);font-size:18px;font-weight:600;min-width:140px">Den Haag Centraal</span>
    <span class="mono" style="font-size:11px;color:var(--fg-mute);min-width:120px">--fg · #eef3f9</span>
    <span style="font-size:11px;color:var(--fg-mute)">primair</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:14px">
    <span style="color:var(--fg-dim);font-size:15px;min-width:140px">via Utrecht Centraal</span>
    <span class="mono" style="font-size:11px;color:var(--fg-mute);min-width:120px">--fg-dim · #9aabbe</span>
    <span style="font-size:11px;color:var(--fg-mute)">gedimd</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:14px">
    <span style="color:var(--fg-mute);font-size:13px;min-width:140px">Bewaard 3 dagen geleden</span>
    <span class="mono" style="font-size:11px;color:var(--fg-mute);min-width:120px">--fg-mute · #5c6c7e</span>
    <span style="font-size:11px;color:var(--fg-mute)">vaag</span>
  </div>
</div>
</body></html>
