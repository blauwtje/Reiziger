<!DOCTYPE html><html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<style>
  @keyframes flapDemo { 0%{transform:rotateX(-90deg);opacity:0} 60%{transform:rotateX(8deg);opacity:1} 100%{transform:rotateX(0);opacity:1} }
  .flap-cell { display:inline-block; transform-origin:top center; animation: flapDemo 0.5s cubic-bezier(.6,.02,.2,1) both infinite; animation-delay: 0ms; }
  .flap-cell:nth-child(2){ animation-delay: 100ms; }
  .flap-cell:nth-child(3){ animation-delay: 200ms; }
  .flap-cell:nth-child(4){ animation-delay: 300ms; }
  .flap-cell:nth-child(5){ animation-delay: 400ms; }
</style>
<div class="eyebrow">signature motion · split-flap reveal</div>
<div style="background:var(--ink-800);border:1px solid var(--ink-line);border-radius:var(--r-md);padding:24px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;gap:10px;justify-content:center;font-family:var(--font-mono);font-size:42px;color:var(--signal);font-weight:500;letter-spacing:-0.02em">
    <span class="flap-cell">0</span><span class="flap-cell">8</span><span class="flap-cell">:</span><span class="flap-cell">4</span><span class="flap-cell">2</span>
  </div>
  <div style="display:flex;align-items:center;gap:18px;font-size:12px;color:var(--fg-mute);justify-content:center">
    <span class="mono">420ms</span>
    <span class="mono">cubic-bezier(.6,.02,.2,1)</span>
    <span class="mono">60ms stagger</span>
  </div>
</div>
</body></html>
