<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Reiziger — Web Desktop</title>
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: #0a0d12;
      font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    button, input { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="screens-web.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "screen": "plan",
      "theme": "dark"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const theme = t.theme;
      const screen = t.screen;

      const screens = {
        plan: (
          <WebShell theme={theme} navActive="plan" rail={<RailSearch />}>
            <BoardResults />
          </WebShell>
        ),
        detail: (
          <WebShell theme={theme} navActive="plan" rail={<RailSaved />}>
            <BoardDetail />
          </WebShell>
        ),
        today: (
          <WebShell theme={theme} navActive="today" rail={<RailSaved />}>
            <BoardToday />
          </WebShell>
        ),
        settings: (
          <WebShell theme={theme} navActive="me" rail={<RailSaved />}>
            <BoardSettings />
          </WebShell>
        ),
      };

      return (
        <>
          <div
            data-theme={theme}
            style={{ width:'100vw', height:'100vh', display:'flex', flexDirection:'column', background:'var(--bg)' }}
          >
            {screens[screen]}
          </div>

          <TweaksPanel title="Reiziger · tweaks">
            <TweakSection label="Scherm">
              <TweakSelect
                label="Weergave"
                value={screen}
                options={[
                  { value:'plan',     label:'Planner · resultaten' },
                  { value:'detail',   label:'Reisdetail' },
                  { value:'today',    label:'Vandaag' },
                  { value:'settings', label:'Mij · voorkeuren' },
                ]}
                onChange={v => setTweak('screen', v)}
              />
            </TweakSection>
            <TweakSection label="Thema">
              <TweakRadio
                label="Modus"
                value={theme}
                options={[
                  { value:'dark',  label:'Donker' },
                  { value:'light', label:'Licht' },
                ]}
                onChange={v => setTweak('theme', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
