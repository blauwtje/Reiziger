<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Reiziger — planner (web)</title>
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: #f0eee9;
      font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    button, input { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="browser-window.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" src="screens-web.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark"
    }/*EDITMODE-END*/;

    // Browser-framed artboard helper. Each Reiziger screen sits inside a
    // Chrome window so reviewers see how the planner actually presents on
    // web — full app chrome, tabbed, URL bar, dark Chrome on dark board.
    function web(node, url, theme) {
      return (
        <ChromeWindow
          width={W}
          height={H}
          url={`reiziger.app${url}`}
          tabs={[
            { title: 'Reiziger — Planner', favicon: true },
            { title: 'NS Reisplanner' },
            { title: '9292.nl' },
          ]}
          activeIndex={0}
        >
          <div style={{ width:'100%', height:'100%', background:'var(--bg)' }}>
            {node}
          </div>
        </ChromeWindow>
      );
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const theme = t.theme;
      const other = theme === 'dark' ? 'light' : 'dark';

      // Each screen is the whole web app — top nav + left rail + board.
      const planner = (
        <WebShell theme={theme} navActive="plan" rail={<RailSearch />}>
          <BoardResults />
        </WebShell>
      );
      const plannerLight = (
        <WebShell theme={other} navActive="plan" rail={<RailSearch />}>
          <BoardResults />
        </WebShell>
      );
      const detail = (
        <WebShell theme={theme} navActive="plan" rail={<RailSaved />}>
          <BoardDetail />
        </WebShell>
      );
      const today = (
        <WebShell theme={theme} navActive="today" rail={<RailSaved />}>
          <BoardToday />
        </WebShell>
      );
      const settings = (
        <WebShell theme={theme} navActive="me" rail={<RailSaved />}>
          <BoardSettings />
        </WebShell>
      );

      return (
        <>
          <DesignCanvas
            title="Reiziger — Planner (web UI kit)"
            subtitle="Wat je op web ziet. Bovennavigatie, twee-pane shell (links zoekrail, rechts split-flap board), aankomsttijd-planner, slimme overstapminima, storingen, abonnementsadvies. Donker (board) en licht (papier) thema delen dezelfde tokens."
          >
            <DCSection
              id="planner"
              title="Planner — resultaten"
              subtitle="Standaardweergave. Links: zoeken (van/naar, aankomsttijd, kortingen, per-station overstap). Rechts: het board met de gevonden reizen in een vaste kolomraster."
            >
              <DCArtboard id="w-plan-dark"  label="01 · Planner · donker" width={W} height={H}>
                {web(planner, '/plan?from=burgwal-12&to=hoog-catharijne-8&arr=18:00', theme)}
              </DCArtboard>
              <DCArtboard id="w-plan-light" label={`02 · Planner · ${other}`} width={W} height={H}>
                {web(plannerLight, '/plan?from=burgwal-12&to=hoog-catharijne-8&arr=18:00', other)}
              </DCArtboard>
            </DCSection>

            <DCSection
              id="detail"
              title="Reisdetail"
              subtitle="Eén reis uitgeklapt — vertrek-/aankomst-flap, kosten met korting, CO₂, en de been-voor-been route met slimme overstaptijd-bewerker."
            >
              <DCArtboard id="w-detail" label="03 · Reisdetail" width={W} height={H}>
                {web(detail, '/reis/j1', theme)}
              </DCArtboard>
            </DCSection>

            <DCSection
              id="today"
              title="Vandaag"
              subtitle="Wat je ziet als je inlogt zonder query — auto-suggestie op basis van weekpatroon, storingen op jouw routes, vaste reizen."
            >
              <DCArtboard id="w-today" label="04 · Vandaag" width={W} height={H}>
                {web(today, '/vandaag', theme)}
              </DCArtboard>
            </DCSection>

            <DCSection
              id="me"
              title="Mij · voorkeuren"
              subtitle="Reisprofiel, kortingen, per-station overstap, agenda-koppelingen, en abonnementsadvies op je werkelijke ritten."
            >
              <DCArtboard id="w-me" label="05 · Voorkeuren" width={W} height={H}>
                {web(settings, '/mij', theme)}
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Reiziger · tweaks">
            <TweakSection label="Thema">
              <TweakRadio
                label="Modus"
                value={t.theme}
                options={[
                  { value: 'dark',  label: 'Donker' },
                  { value: 'light', label: 'Licht' },
                ]}
                onChange={v => setTweak('theme', v)}
              />
            </TweakSection>
            <TweakSection label="Notities">
              <div style={{ padding: '6px 12px 10px', fontSize: 12, color: '#666', lineHeight: 1.5 }}>
                Toggle tussen donker (split-flap board) en licht (warm papier).
                Beide thema's gebruiken dezelfde amber-signaalkleur, alle nummers
                blijven mono.
              </div>
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
